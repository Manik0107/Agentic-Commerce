[project]
name = "agentic-commerce"
version = "1.0.0"
description = "Catalog layer, protocol adapter and bounded-authority payment gate for AI buyers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "google-genai>=2.20",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentic_commerce"]

[dependency-groups]
dev = ["ruff>=0.16"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
